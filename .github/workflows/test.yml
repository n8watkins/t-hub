name: Test

# The server-side TEST GATE (audit CRITICAL "no CI test gate"): runs on every
# pull_request to main, every push to main, and as the release workflow's reusable
# quality gate. It mirrors the exact suites the crews / no-mistakes run locally,
# so a red suite blocks merge and release instead of relying on a local test run.
#
# Rust, CLI, frontend, and browser suites run on Ubuntu. The Rust tests shell
# out to `tmux -L t-hub` on an isolated socket, while Playwright exercises the
# browser fixture in real Chromium. Package 5 evidence and installer contracts
# run on Windows so their PowerShell and line-ending behavior is authoritative.
# Building and inspecting the real Tauri installer remains in release.yml.

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Allow a manual run from the Actions tab for debugging the gate itself.
  workflow_dispatch:

# Cancel an in-flight run when a new commit is pushed to the same PR.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-msrv:
    name: Rust MSRV 1.89
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
        working-directory: .

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.89.0

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri
          key: msrv-1.89

      - name: cargo check --workspace --locked
        run: cargo check --workspace --locked

  rust:
    name: Rust (cargo test + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Two categories of system deps:
      #  - tmux: the Rust tests (and mcp_e2e) shell out to the real `tmux` binary
      #    on the isolated `-L t-hub` socket.
      #  - the Tauri v2 Linux stack (glib/gtk/webkit2gtk/...): the desktop crate is
      #    a Tauri app, so it LINKS against these even to compile the test binary on
      #    Linux (glib-sys' build script fails without them). The app targets
      #    Windows/WSL, but building its tests on the fast ubuntu runner needs the
      #    Linux Tauri deps present. ubuntu-latest does NOT ship them.
      - name: Install system dependencies (tmux + Tauri Linux stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tmux \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file
        working-directory: .

      # The preview/devserver process-supervisor tests spawn
      # `unshare --user --map-current-user --pid --fork --mount --mount-proc` to
      # sandbox a target process tree. Ubuntu 24.04 (ubuntu-latest) ships an
      # AppArmor policy that restricts unprivileged user namespaces
      # (kernel.apparmor_restrict_unprivileged_userns=1), so that unshare fails
      # writing /proc/self/uid_map with EPERM ("Operation not permitted") and the
      # supervisor tests fail. The runner is a real VM with passwordless sudo, so
      # relax the restriction to restore the classic unprivileged user namespaces
      # these tests rely on. Guarded so it is a no-op on kernels without the knob.
      - name: Enable unprivileged user namespaces (preview supervisor tests)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [ -e /proc/sys/kernel/unprivileged_userns_clone ]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
        working-directory: .

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/desktop/src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # This committed gate builds the real MCP binary before workspace tests.
      - name: cargo workspace gate
        run: ../scripts/workspace_gate.sh

      # The canonical `th` CLI is a separate Cargo workspace, so the desktop
      # workspace gate above does not discover its human/JSON contract suites.
      - name: CLI workspace tests
        run: cargo test --manifest-path ../../cli/Cargo.toml --locked

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  frontend:
    name: Frontend (vitest + bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm must be set up BEFORE setup-node's pnpm cache can resolve.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc --noEmit` — the same command `pnpm typecheck` runs.
      - name: tsc --noEmit
        run: pnpm --filter t-hub-desktop typecheck

      # `eslint .` - the JS/TS counterpart to the Rust job's clippy gate, and
      # the same command the local `frontend-lint` lane runs. Deliberately NOT
      # `--max-warnings 0`: the step fails on ESLint ERRORS, while
      # react-hooks/exhaustive-deps and the fast-refresh findings stay warnings
      # so their existing backlog does not block unrelated pull requests.
      - name: eslint
        run: pnpm --filter t-hub-desktop lint

      # `vitest run` — the same command `pnpm --filter t-hub-desktop test` runs.
      - name: vitest run
        run: pnpm --filter t-hub-desktop test

      # Compile the production bundle without running TypeScript a second time.
      # This catches Vite import, asset, and bundling failures that jsdom does not.
      - name: Production frontend build
        run: pnpm --filter t-hub-desktop build:bundle

      - name: Desktop version contract
        run: bash apps/desktop/scripts/check-version.sh --history

      - name: Voice announcement gate contract
        run: bash apps/desktop/scripts/announce_gate.test.sh

      - name: Packaged runtime benchmark contract
        run: bash scripts/perf/perf-benchmark.test.sh

      - name: Local test profile contract
        run: bash scripts/ci/local-test.test.sh

      - name: GitHub Actions pinning contract
        run: bash scripts/ci/workflow-actions.test.sh

      - name: Handoff skill contract
        run: bash scripts/captain/handoff-skill.test.sh

  host-cli-contracts:
    name: Host CLI contracts (Codex + Claude)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pinned host CLIs
        run: npm install --global @openai/codex@0.145.0 @anthropic-ai/claude-code@2.1.220

      - name: Codex provisioning contract
        run: bash scripts/captain/ensure-thub-codex.test.sh

      - name: Claude provisioning contract
        run: bash scripts/captain/ensure-thub-claude.test.sh

      - name: Codex installation contract
        run: bash scripts/captain/install-thub-codex.test.sh

  frontend-browser:
    name: Frontend browser (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter t-hub-desktop exec playwright install --with-deps chromium

      # Runs the real Chromium suite, including the responsive Package 2 header
      # matrix. The package script owns Vite startup and teardown.
      - name: Playwright browser suite
        run: pnpm --filter t-hub-desktop test:browser

  package5-windows-contracts:
    name: Package 5 Windows contracts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Package 5 evidence manifest contract
        shell: pwsh
        run: ./scripts/windows/write-package5-provenance.test.ps1

      # Exercises LF, CRLF, legacy-development migration safety, production
      # isolation, marker rewriting, payload identity, and workflow ordering.
      - name: Development installer validator fixtures
        shell: pwsh
        run: ./scripts/windows/validate-dev-installer.test.ps1
